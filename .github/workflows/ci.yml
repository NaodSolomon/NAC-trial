name: CI

on:
  pull_request:
  push:
    branches: [main, Backend/Features]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nehemiah_test
          POSTGRES_PASSWORD: nehemiah_test
          POSTGRES_DB: nehemiah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nehemiah_test -d nehemiah_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://nehemiah_test:nehemiah_test@localhost:5432/nehemiah_test
      TEST_MAIL_HOST: localhost
      TEST_MAIL_PORT: 1025
      TEST_MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:ci
      - run: pnpm openapi:lint
      - name: Publish generated OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/dist/openapi.json
          if-no-files-found: error
      - run: docker build --target runner -t nehemiah-backend:test .
      - name: Apply packaged migrations from the runner image
        run: |
          docker network create nehemiah-migration-image-test
          docker run --detach --name nehemiah-migration-postgres \
            --network nehemiah-migration-image-test \
            --tmpfs /var/lib/postgresql/data \
            --env POSTGRES_USER=nehemiah_migration \
            --env POSTGRES_PASSWORD=nehemiah_migration \
            --env POSTGRES_DB=nehemiah_migration \
            postgres:16-alpine

          for attempt in $(seq 1 30); do
            if docker exec nehemiah-migration-postgres \
              pg_isready -U nehemiah_migration -d nehemiah_migration; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs nehemiah-migration-postgres
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network nehemiah-migration-image-test \
            --env NODE_ENV=production \
            --env DATABASE_URL=postgresql://nehemiah_migration:nehemiah_migration@nehemiah-migration-postgres:5432/nehemiah_migration \
            nehemiah-backend:test node dist/src/database/run-migrations.js

          # A second run proves the packaged migration chain is idempotent.
          docker run --rm --network nehemiah-migration-image-test \
            --env NODE_ENV=production \
            --env DATABASE_URL=postgresql://nehemiah_migration:nehemiah_migration@nehemiah-migration-postgres:5432/nehemiah_migration \
            nehemiah-backend:test node dist/src/database/run-migrations.js

          expected_migrations=$(node -p "require('./src/database/migrations/meta/_journal.json').entries.length")
          applied_migrations=$(docker exec nehemiah-migration-postgres \
            psql -U nehemiah_migration -d nehemiah_migration -Atc \
            'select count(*) from drizzle.__drizzle_migrations')
          test "$applied_migrations" = "$expected_migrations"
          test "$(docker exec nehemiah-migration-postgres \
            psql -U nehemiah_migration -d nehemiah_migration -Atc \
            "select to_regclass('public.admins') is not null")" = "t"
      - name: Remove migration image test database
        if: always()
        run: |
          docker rm --force nehemiah-migration-postgres 2>/dev/null || true
          docker network rm nehemiah-migration-image-test 2>/dev/null || true
      - name: Build media backup image
        working-directory: .
        run: docker build -f ops/backup/media-backup.Dockerfile -t nehemiah-media-backup:test .
      - name: Validate benchmark profile
        working-directory: .
        run: |
          docker compose -f docker-compose.benchmark.yml config --quiet
          docker run --rm -v "$GITHUB_WORKSPACE/performance/k6:/scripts:ro" \
            grafana/k6:0.54.0 inspect /scripts/concurrency.js

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: http://127.0.0.1:4010/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Download backend OpenAPI contract
        uses: actions/download-artifact@v4
        with:
          name: openapi-contract
          path: backend/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm performance:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm lighthouse:ci
      - name: Publish Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci
          if-no-files-found: warn

  visual-regression:
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [visual-desktop, visual-mobile]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Publish visual differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences-${{ matrix.project }}
          path: frontend/test-results
          if-no-files-found: warn

  full-stack-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate disposable E2E stack
        run: docker compose -f docker-compose.e2e.yml config --quiet
      - name: Run real full-stack journeys
        run: >-
          docker compose -f docker-compose.e2e.yml up --build
          --abort-on-container-exit --exit-code-from playwright-e2e playwright-e2e
      - name: Remove disposable E2E data
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
