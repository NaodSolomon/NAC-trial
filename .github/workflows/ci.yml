name: CI

on:
  pull_request:
  push:
    branches: [main, Backend/Features]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nehemiah_test
          POSTGRES_PASSWORD: nehemiah_test
          POSTGRES_DB: nehemiah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nehemiah_test -d nehemiah_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://nehemiah_test:nehemiah_test@localhost:5432/nehemiah_test
      TEST_MAIL_HOST: localhost
      TEST_MAIL_PORT: 1025
      TEST_MAILPIT_API_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm test:ci
      - run: pnpm openapi:lint
      - name: Publish generated OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/dist/openapi.json
          if-no-files-found: error
      - run: docker build --target runner -t nehemiah-backend:test .
      - name: Build media backup image
        working-directory: .
        run: docker build -f ops/backup/media-backup.Dockerfile -t nehemiah-media-backup:test .
      - name: Validate benchmark profile
        working-directory: .
        run: |
          docker compose -f docker-compose.benchmark.yml config --quiet
          docker run --rm -v "$GITHUB_WORKSPACE/performance/k6:/scripts:ro" \
            grafana/k6:0.54.0 inspect /scripts/concurrency.js

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Download backend OpenAPI contract
        uses: actions/download-artifact@v4
        with:
          name: openapi-contract
          path: backend/dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm performance:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  full-stack-e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate disposable E2E stack
        run: docker compose -f docker-compose.e2e.yml config --quiet
      - name: Run real full-stack journeys
        run: >-
          docker compose -f docker-compose.e2e.yml up --build
          --abort-on-container-exit --exit-code-from playwright-e2e playwright-e2e
      - name: Remove disposable E2E data
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
