name: Production deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nehemiah-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nehemiah-frontend:${{ github.sha }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd "${{ secrets.PROD_APP_PATH }}"
            git pull --ff-only origin main
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nehemiah-backend:${{ github.sha }} \
            FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nehemiah-frontend:${{ github.sha }} \
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nehemiah-backend:${{ github.sha }} \
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend node dist/src/database/run-migrations.js
            BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nehemiah-backend:${{ github.sha }} \
            FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/nehemiah-frontend:${{ github.sha }} \
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --pull always
