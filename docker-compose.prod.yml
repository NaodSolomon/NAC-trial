services:
  traefik:
    image: traefik:v3
    restart: always
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/yourusername/nehemiah-frontend:latest}
    restart: always
    env_file:
      - ./frontend/.env.production
    environment:
      NODE_ENV: production
      API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env.production}/api/v1
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env.production}/api/v1
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      NEXT_PUBLIC_STORAGE_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?Set MEDIA_PUBLIC_ORIGIN in .env.production}
      MEDIA_IMAGE_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?Set MEDIA_PUBLIC_ORIGIN in .env.production}
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}`)
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    depends_on:
      - backend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/yourusername/nehemiah-backend:latest}
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      TRIAL_MODE: "false"
      SWAGGER_ENABLED: "false"
      PAYMENTS_ENABLED: "false"
      FRONTEND_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      PASSWORD_RESET_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}/admin/reset-password
      STORAGE_PUBLIC_URL: ${MEDIA_PUBLIC_ORIGIN:?Set MEDIA_PUBLIC_ORIGIN in .env.production}
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${API_DOMAIN:?Set API_DOMAIN in .env.production}`)
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/system/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ./backend/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-nehemiah} -d ${DATABASE_NAME:-nehemiah}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    entrypoint: ["/bin/sh", "/scripts/postgres-backup.sh"]
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - ./ops/backup/postgres-backup.sh:/scripts/postgres-backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres-backup-verify:
    image: postgres:16-alpine
    restart: "no"
    profiles: ["backup-verify"]
    env_file:
      - ./backend/.env.production
    entrypoint: ["/bin/sh", "/scripts/postgres-restore-verify.sh"]
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups:ro
      - ./ops/backup/postgres-restore-verify.sh:/scripts/postgres-restore-verify.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-backup:
    build:
      context: .
      dockerfile: ops/backup/media-backup.Dockerfile
    image: nehemiah-media-backup:local
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    entrypoint: ["/bin/sh", "/scripts/media-backup.sh"]
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups
      - ./ops/backup/media-backup.sh:/scripts/media-backup.sh:ro

  media-backup-verify:
    build:
      context: .
      dockerfile: ops/backup/media-backup.Dockerfile
    image: nehemiah-media-backup:local
    restart: "no"
    profiles: ["backup-verify"]
    env_file:
      - ./backend/.env.production
    entrypoint: ["/bin/sh", "/scripts/media-restore-verify.sh"]
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups:ro
      - ./ops/backup/media-restore-verify.sh:/scripts/media-restore-verify.sh:ro

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    restart: always
    volumes:
      - uptime_kuma_data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.uptime.rule=Host(`${STATUS_DOMAIN:?Set STATUS_DOMAIN in .env.production}`)
      - traefik.http.routers.uptime.tls.certresolver=letsencrypt
      - traefik.http.services.uptime.loadbalancer.server.port=3001

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    profiles: ["ops"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=false

volumes:
  letsencrypt:
  postgres_data:
  redis_data:
  uptime_kuma_data:
