services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nehemiah_test
      POSTGRES_PASSWORD: nehemiah_test
      POSTGRES_DB: nehemiah_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nehemiah_test -d nehemiah_test"]
      interval: 2s
      timeout: 3s
      retries: 15
