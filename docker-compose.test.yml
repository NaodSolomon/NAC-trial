name: nac-trial-integration

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nehemiah_test
      POSTGRES_PASSWORD: nehemiah_test
      POSTGRES_DB: nehemiah_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nehemiah_test -d nehemiah_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit-test:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1026:1025"
      - "127.0.0.1:8026:8025"
    restart: "no"
