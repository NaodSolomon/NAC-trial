services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "pnpm db:migrate:local && pnpm dev"
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-nehemiah}:${DATABASE_PASSWORD:-12345}@postgres:5432/${DATABASE_NAME:-nehemiah}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-nehemiah}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-12345}
      DATABASE_NAME: ${DATABASE_NAME:-nehemiah}
      STORAGE_DRIVER: minio
      MAIL_DRIVER: mailpit
      PAYMENT_DRIVER: fake
      CACHE_DRIVER: redis
      PAYMENTS_ENABLED: "false"
      TRIAL_MODE: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:9000/nehemiah-media
      MAIL_HOST: mailpit
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-contact@nehemiah.local}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-20}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/admin/reset-password}
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/system/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    command: pnpm dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_STORAGE_ORIGIN: http://localhost:9000
      NEXT_PUBLIC_MEDIA_HOSTS: ${NEXT_PUBLIC_MEDIA_HOSTS:-}
      MEDIA_IMAGE_ORIGIN: http://minio:9000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-nehemiah}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-12345}
      POSTGRES_DB: ${DATABASE_NAME:-nehemiah}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-nehemiah} -d ${DATABASE_NAME:-nehemiah}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing local/nehemiah-media &&
        mc anonymous set download local/nehemiah-media &&
        mc cp /demo-images/gallery_1.jpg local/nehemiah-media/demo/gallery-family-support-en.jpg &&
        mc cp /demo-images/gallery_2.jpg local/nehemiah-media/demo/gallery-community-en.jpg &&
        mc cp /demo-images/gallery_1.jpg local/nehemiah-media/demo/gallery-family-support-am.jpg &&
        mc cp /demo-images/gallery_2.jpg local/nehemiah-media/demo/gallery-community-am.jpg &&
        mc cp /demo-resources/trial-family-resource-en.txt local/nehemiah-media/demo/resources/trial-family-resource-en.txt &&
        mc cp /demo-resources/trial-family-resource-am.txt local/nehemiah-media/demo/resources/trial-family-resource-am.txt
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./frontend/public/images:/demo-images:ro
      - ./backend/src/database/seeds/assets:/demo-resources:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:
